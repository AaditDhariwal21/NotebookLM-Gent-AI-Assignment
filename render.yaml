services:
  - type: web
    name: notebook-rag-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Secret — set in Render dashboard, NOT committed.
      - key: OPENAI_API_KEY
        sync: false
      # Provider config (Gemini via OpenAI-compatible endpoint).
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: CHAT_MODEL
        value: gemini-2.0-flash
      # Tuning.
      - key: CHUNK_SIZE
        value: "1200"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: TOP_K
        value: "5"
